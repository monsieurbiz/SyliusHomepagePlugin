sylius_grid:
    grids:
        monsieurbiz_homepage:
            driver:
                name: doctrine/orm
                options:
                    class: '%monsieurbiz_homepage.model.homepage.class%'
                    repository:
                        method: createListQueryBuilder
                        arguments: ["%locale%"]
            limits: [25, 50, 100, 200]
            sorting:
                id: desc
            fields:
                id:
                    type: string
                    label: monsieurbiz_homepage.ui.form.id
                    sortable: ~
                name:
                    type: twig
                    path: .
                    label: monsieurbiz_homepage.ui.form.name
                    sortable: translation.name
                    options:
                        template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/name.html.twig'
                channels:
                    type: twig
                    label: sylius.ui.channels
                    options:
                        template: "@SyliusAdmin/shared/grid/field/channels.html.twig"
                        vars:
                            th_class: "w-1 text-center"
            actions:
                main:
                    switches:
                        type: default
                        label: monsieurbiz_homepage.ui.switch.view
                        options:
                            link:
                                route: monsieurbiz_homepage_admin_homepage_switch_index
                    create:
                        type: create
                        label: monsieurbiz_homepage.ui.actions.create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                subitem:
                    activation:
                        type: list
                        label: monsieurbiz_homepage.ui.switch.title
                        options:
                            visible: resource.enabled
                            links:
                                create:
                                    label: monsieurbiz_homepage.ui.switch.create
                                    route: monsieurbiz_homepage_admin_homepage_switch_create
                                    parameters: { id: resource.id }
                                activate_now:
                                    label: monsieurbiz_homepage.ui.switch.activate_now
                                    route: monsieurbiz_homepage_admin_homepage_switch_activate_now
                                    parameters: { id: resource.id }
            filters:
                name:
                    type: string
                    label: monsieurbiz_homepage.ui.form.name
                    options:
                        fields: [ translation.name ]
                content:
                    type: string
                    label: monsieurbiz_homepage.ui.form.content
                    options:
                        fields: [ translation.content ]
                channel:
                    type: entity
                    label: sylius.ui.channel
                    options:
                        fields: [ channels.id ]
                    form_options:
                        class: "%sylius.model.channel.class%"
