sylius_twig_hooks:
    hooks:
        'monsieurbiz.homepage.index#metatags':
            homepage_metatags:
                template: '@MonsieurBizSyliusHomepagePlugin/Homepage/metatags.html.twig'
                priority: 0
        'monsieurbiz.homepage.index':
            content:
                template: '@MonsieurBizSyliusHomepagePlugin/Homepage/Index/content.html.twig'
                priority: 0
        
        # Create homepage
        'sylius_admin.homepage.create.content':
            form:
                component: 'sylius_admin:monsieurbiz_homepage:homepage:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form.html.twig'
                priority: 0

        'sylius_admin.homepage.create.content.form.sections':
            general:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general.html.twig'
                priority: 200
            translations:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations.html.twig'
                priority: 100

        'sylius_admin.homepage.create.content.form.sections.general':
            default:
                enabled: false
            channels:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general/channels.html.twig'
                priority: 200

        'sylius_admin.homepage.create.content.form.sections.translations':
            content:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/content.html.twig'
                priority: 200
            name:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/name.html.twig'
                priority: 100
            seo:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/seo.html.twig'
                priority: 0

        # Edit homepage
        'sylius_admin.homepage.update.content':
            form:
                component: 'sylius_admin:monsieurbiz_homepage:homepage:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form.html.twig'
                priority: 0

        'sylius_admin.homepage.update.content.form.sections':
            general:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general.html.twig'
                priority: 200
            translations:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations.html.twig'
                priority: 100

        'sylius_admin.homepage.update.content.form.sections.general':
            default:
                enabled: false
            channels:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general/channels.html.twig'
                priority: 200

        'sylius_admin.homepage.update.content.form.sections.translations':
            content:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/content.html.twig'
                priority: 200
            name:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/name.html.twig'
                priority: 100
            seo:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/seo.html.twig'
                priority: 0
