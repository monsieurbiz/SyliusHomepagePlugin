sylius_twig_hooks:
    hooks:
        'monsieurbiz_homepage.admin.switch_list.index.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block/title.html.twig'
                configuration: { title: monsieurbiz_homepage.ui.switch.title }
                priority: 100
        'monsieurbiz_homepage.admin.switch_history.index.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block/title.html.twig'
                configuration:
                    title: monsieurbiz_homepage.ui.switch.history
                    subheader: monsieurbiz_homepage.ui.switch.history_help
                priority: 100
        'monsieurbiz_homepage.admin.switch_list.index.content.header.title_block.actions':
            navigation:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage_switch/grid/navigation.html.twig'
                configuration:
                    link: { route: monsieurbiz_homepage_admin_homepage_switch_history, label: monsieurbiz_homepage.ui.switch.history }
        'monsieurbiz_homepage.admin.switch_history.index.content.header.title_block.actions':
            navigation:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage_switch/grid/navigation.html.twig'
                configuration:
                    link: { route: monsieurbiz_homepage_admin_homepage_switch_index, label: monsieurbiz_homepage.ui.switch.all_switches }

        'monsieurbiz.homepage.index#metatags':
            homepage_metatags:
                template: '@MonsieurBizSyliusHomepagePlugin/shop/homepage/index/metatags.html.twig'
                priority: 0
        'monsieurbiz.homepage.index':
            content:
                template: '@MonsieurBizSyliusHomepagePlugin/shop/homepage/index/content.html.twig'
                priority: 0
        
        # Create homepage
        'sylius_admin.homepage.create.content':
            form:
                component: 'sylius_admin:monsieurbiz_homepage:homepage:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form.html.twig'
                priority: 0

        'sylius_admin.homepage.create.content.form.sections':
            general:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general.html.twig'
                priority: 200
            translations:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations.html.twig'
                priority: 100

        'sylius_admin.homepage.create.content.form.sections.general':
            default:
                enabled: false
            enabled_field:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general/enabled.html.twig'
                priority: 100
            channels:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general/channels.html.twig'
                priority: 200

        'sylius_admin.homepage.create.content.form.sections.translations':
            content:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/content.html.twig'
                priority: 200
            name:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/name.html.twig'
                priority: 100
            seo:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/seo.html.twig'
                priority: 0

        # Edit homepage
        'sylius_admin.homepage.update.content':
            form:
                component: 'sylius_admin:monsieurbiz_homepage:homepage:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form.html.twig'
                priority: 0

        'sylius_admin.homepage.update.content.form.sections':
            general:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general.html.twig'
                priority: 200
            translations:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations.html.twig'
                priority: 100

        'sylius_admin.homepage.update.content.form.sections.general':
            default:
                enabled: false
            enabled_field:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general/enabled.html.twig'
                priority: 100
            channels:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/general/channels.html.twig'
                priority: 200

        'sylius_admin.homepage.update.content.form.sections.translations':
            content:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/content.html.twig'
                priority: 200
            name:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/name.html.twig'
                priority: 100
            seo:
                template: '@MonsieurBizSyliusHomepagePlugin/admin/homepage/form/sections/translations/seo.html.twig'
                priority: 0
